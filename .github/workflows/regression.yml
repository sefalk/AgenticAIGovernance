# Regression gate for the framework payload.
#
# This is the check that gives "all conditions are met" a meaning. Until it
# exists, the 15 regression suites run only on a maintainer's laptop and
# GitHub has no way to know whether a pull request is sound -- which makes
# auto-merge indistinguishable from merging on the author's say-so.
#
# Windows is not a preference here. The suites are Windows PowerShell 5.1
# scripts and the hooks they exercise ship in .ps1/.sh pairs; ubuntu runners
# have no `powershell`.

name: Regression Suites

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    # The branch rulesets require this string as their status check context.
    # Renaming it does not fail the gate -- it stalls every pull request on a
    # check that no longer reports. See docs/rulesets/README.md.
    name: Regression suites (Windows PowerShell 5.1)
    runs-on: windows-latest
    # Measured: 5 min 59 s on the runner against 16 minutes for the same sweep
    # on a maintainer's laptop. The ceiling is far above both so that a hang is
    # caught by the per-suite timeout rather than by the job budget.
    timeout-minutes: 60

    steps:
      # test-hooks-integration.ps1 is excluded from the sweep below because a
      # hosted runner cannot run it. That left the hooks -- the most
      # safety-critical part of the payload -- covered by nothing once the
      # hand-run sweep was replaced by CI. This step does not close that hole;
      # it makes the hole visible at the moment it matters.
      #
      # It is attestation, not verification. It records that someone states
      # they ran the suite. It cannot prove they did, and nothing built on it
      # may be described as evidence that the hooks were tested. It is worth
      # having because the failure it prevents is forgetting, not lying.
      #
      # A dev -> main promotion is exempt: it contains every file the release
      # cycle touched, so this gate would always fire and the author would
      # attest to work they did not do in that pull request. A statement
      # nobody can mean is worse than no statement (#234). The promotion step
      # further down checks the contributing pull requests instead.
      - name: Require local-check attestation for hook changes
        if: ${{ github.event_name == 'pull_request' && !(github.base_ref == 'main' && github.head_ref == 'dev') }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          $marker = 'local-check: test-hooks-integration.ps1'

          $files = gh api "repos/$env:REPO/pulls/$env:PR_NUMBER/files" --paginate --jq '.[].filename'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Could not list the changed files. Failing rather than passing on an unanswered question."
            exit 1
          }

          $hookFiles = @($files | Where-Object { $_ -like 'flavors/github-copilot/.github/hooks/*' })
          if ($hookFiles.Count -eq 0) {
            Write-Host "No files under flavors/github-copilot/.github/hooks/ -- attestation not required."
            exit 0
          }

          # Read the body from the API rather than the event payload, so that
          # adding the marker and re-running this job is enough to clear the
          # check. A re-run replays the original payload, which would still
          # carry the body as it was when the run was triggered.
          $body = gh api "repos/$env:REPO/pulls/$env:PR_NUMBER" --jq '.body'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Could not read the pull request body. Failing rather than passing on an unanswered question."
            exit 1
          }

          # HTML comments are stripped first. The pull request template carries
          # the marker line commented out, and a template nobody edited must
          # not satisfy a check about work somebody did.
          $body = [regex]::Replace([string]$body, '(?s)<!--.*?-->', '')

          if ($body -like "*$marker*") {
            Write-Host "Attestation present. Recorded, not verified."
            exit 0
          }

          Write-Host "Changed under the hooks directory:"
          $hookFiles | ForEach-Object { Write-Host "  $_" }
          Write-Host "::error::This pull request changes files under flavors/github-copilot/.github/hooks/. test-hooks-integration.ps1 covers them and CI cannot run it. Run it locally, then add this line to the pull request body and re-run this job: $marker"
          exit 1

      # The files that govern this repository's own development -- editor
      # settings, the installed pre-commit hook, and CI itself -- are where an
      # unintended change is least likely to be read, because reviewers read
      # the payload diff. #123 records a subagent that returned nothing and had
      # modified .vscode/settings.json anyway. It was caught by a hand-run
      # `git status`, and nothing required that to happen.
      #
      # Payload hooks under flavors/ are deliberately not covered: they have
      # their own gate above. The prefixes are exact for that reason --
      # `flavors/github-copilot/.github/...` does not start with `.github/`.
      #
      # Like the attestation, this is a declaration gate. It proves somebody
      # wrote down why the environment changed. It does not review the change,
      # and it must not be cited as though it had.
      #
      # It runs even when the step above failed, so that an author learns about
      # both problems in one run rather than in two round trips.
      #
      # Exempt on a dev -> main promotion, for the reason given above (#234).
      - name: Require declaration for environment changes
        if: ${{ !cancelled() && github.event_name == 'pull_request' && !(github.base_ref == 'main' && github.head_ref == 'dev') }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          $prefixes = @('.vscode/', '.githooks/', '.github/')

          $files = gh api "repos/$env:REPO/pulls/$env:PR_NUMBER/files" --paginate --jq '.[].filename'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Could not list the changed files. Failing rather than passing on an unanswered question."
            exit 1
          }

          $envFiles = @($files | Where-Object {
            $path = $_
            @($prefixes | Where-Object { $path.StartsWith($_) }).Count -gt 0
          })
          if ($envFiles.Count -eq 0) {
            Write-Host "No files under .vscode/, .githooks/ or root .github/ -- declaration not required."
            exit 0
          }

          # Read the body from the API rather than the event payload, so that
          # adding the line and re-running this job is enough to clear the
          # check. A re-run replays the payload as it was when triggered.
          $bodyLines = gh api "repos/$env:REPO/pulls/$env:PR_NUMBER" --jq '.body'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Could not read the pull request body. Failing rather than passing on an unanswered question."
            exit 1
          }

          # PowerShell hands back a native command's multi-line output as an
          # array of lines, and casting that array to a string joins it with
          # spaces -- which collapses the body to one line and defeats every
          # line anchor below. Measured on #165: the gate did not see its own
          # declaration. Out-String restores the newlines.
          $body = $bodyLines | Out-String

          # The template carries the marker commented out, and a template
          # nobody edited must not satisfy a check about work somebody did.
          $body = [regex]::Replace([string]$body, '(?s)<!--.*?-->', '')

          # A bare marker would be a checkbox, and a checkbox gets ticked. The
          # reason is the part a reviewer actually needs, so it is required.
          #
          # The horizontal-whitespace class is deliberate: `\s*` would swallow
          # the newline after an empty `env-change:` and the marker would read
          # as absent, which costs the author the specific error message.
          # Every match is considered, so a template line left empty above a
          # filled-in one does not mask the real declaration.
          $markerMatches = [regex]::Matches($body, '(?m)^[ \t]*env-change:[ \t]*(.*)$')
          $reason = ''
          foreach ($m in $markerMatches) {
            $candidate = $m.Groups[1].Value.Trim()
            if ($candidate.Length -ge 10) { $reason = $candidate; break }
          }

          if ($reason) {
            Write-Host "Environment change declared: $reason"
            Write-Host "Declared, not reviewed."
            exit 0
          }

          Write-Host "Changed under the environment paths:"
          $envFiles | ForEach-Object { Write-Host "  $_" }
          if ($markerMatches.Count -gt 0) {
            Write-Host "::error::The env-change: line states no reason. Say why this pull request changes the environment, in at least 10 characters, then re-run this job."
            exit 1
          }
          Write-Host "::error::This pull request changes files that govern this repository's own development environment. Add a line to the pull request body saying why, then re-run this job: env-change: <reason>"
          exit 1

      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The two gates above are exempt on a dev -> main promotion, which would
      # otherwise leave the release the one pull request that declares nothing.
      # This step is what replaces them: instead of asking the release author
      # to re-attest work they did not do, it checks that each change actually
      # arrived through a pull request that carried its own declaration.
      #
      # It walks the first-parent chain rather than every commit, because that
      # chain is exactly the list of things that landed on dev: one entry per
      # merge, and one entry per direct push. A direct push is the case the
      # per-feature gates can never see, so it is reported here even though it
      # is not itself a missing declaration -- it fails only when it carried a
      # gated path, where a declaration is genuinely absent.
      #
      # File lists come from the merge diff, not from the pull request's file
      # list: what matters is what reached dev, and a pull request can be
      # edited after it merges.
      - name: Verify contributing declarations on a promotion
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev' }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $hookPrefix = 'flavors/github-copilot/.github/hooks/'
          $envPrefixes = @('.vscode/', '.githooks/', '.github/')
          $hookMarker = 'local-check: test-hooks-integration.ps1'

          foreach ($ref in @($env:BASE_SHA, $env:HEAD_SHA)) {
            git cat-file -e "$ref^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Commit $ref is not present in this checkout, so the promotion cannot be examined. Failing rather than passing on an unanswered question."
              exit 1
            }
          }

          # Unit separator, because a commit subject may contain anything else.
          $log = git log --first-parent --format="%H%x1f%P%x1f%s" "$env:BASE_SHA..$env:HEAD_SHA"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Could not read the commit range. Failing rather than passing on an unanswered question."
            exit 1
          }
          if (-not $log) {
            Write-Host "Nothing on dev that is not already on main -- no contributing changes to check."
            exit 0
          }

          $bodyCache = @{}
          function Get-PrBody($number) {
            if ($bodyCache.ContainsKey($number)) { return $bodyCache[$number] }
            $raw = gh api "repos/$env:REPO/pulls/$number" --jq '.body'
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Could not read the body of pull request #$number. Failing rather than passing on an unanswered question."
              exit 1
            }
            # Out-String restores the newlines a native command's line array
            # loses when cast to a string; without it every line anchor below
            # matches nothing (measured on #165).
            $text = $raw | Out-String
            # The template carries both markers commented out, and a template
            # nobody edited must not satisfy a check about work somebody did.
            $text = [regex]::Replace([string]$text, '(?s)<!--.*?-->', '')
            $bodyCache[$number] = $text
            return $text
          }

          $violations = @()
          $unattributed = @()
          $checked = 0

          foreach ($line in @($log)) {
            if (-not $line) { continue }
            $parts = $line -split [char]31
            $sha = $parts[0]
            $subject = $parts[2]

            $files = @(git diff --name-only "$sha^1" $sha)
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Could not diff $sha against its first parent. Failing rather than passing on an unanswered question."
              exit 1
            }

            $hookFiles = @($files | Where-Object { $_ -like "$hookPrefix*" })
            $envFiles = @($files | Where-Object {
              $path = $_
              @($envPrefixes | Where-Object { $path.StartsWith($_) }).Count -gt 0
            })
            $gated = $hookFiles.Count -gt 0 -or $envFiles.Count -gt 0

            $match = [regex]::Match($subject, '^Merge pull request #(\d+)')
            if (-not $match.Success) {
              $short = $sha.Substring(0, 7)
              $note = if ($gated) { 'touched a gated path' } else { 'no gated path' }
              $unattributed += "$short  $note  $subject"
              if ($gated) {
                $violations += "$short arrived on dev without a pull request and changed a gated path, so no declaration was ever required for it."
              }
              continue
            }

            if (-not $gated) { continue }

            $number = $match.Groups[1].Value
            $body = Get-PrBody $number
            $checked++

            if ($hookFiles.Count -gt 0 -and -not ($body -like "*$hookMarker*")) {
              $violations += "#$number changed $($hookFiles.Count) file(s) under $hookPrefix without the line '$hookMarker' in its body."
            }

            if ($envFiles.Count -gt 0) {
              $reason = ''
              foreach ($m in [regex]::Matches($body, '(?m)^[ \t]*env-change:[ \t]*(.*)$')) {
                $candidate = $m.Groups[1].Value.Trim()
                if ($candidate.Length -ge 10) { $reason = $candidate; break }
              }
              if (-not $reason) {
                $violations += "#$number changed $($envFiles.Count) environment file(s) without an 'env-change: <reason>' line of at least 10 characters in its body."
              }
            }
          }

          if ($unattributed.Count -gt 0) {
            Write-Host "Changes that reached dev outside a pull request:"
            $unattributed | ForEach-Object { Write-Host "  $_" }
          }

          if ($violations.Count -eq 0) {
            Write-Host "$checked contributing pull request(s) touched a gated path; each carried its declaration."
            Write-Host "Declared per feature, not re-declared here."
            exit 0
          }

          Write-Host "The declaration is missing on the change itself, not on this release:"
          $violations | ForEach-Object { Write-Host "  $_" }
          Write-Host "::error::$($violations.Count) contributing change(s) reached dev without the declaration their paths require. They are named above. A declaration added to this promotion would cover none of them -- see #234."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ruff and PyYAML are prerequisites of individual suites. Without them
      # those suites print "SKIP: ..." and exit 0 -- green while asserting
      # nothing. -FailOnSkip below turns that into a hard failure, so these
      # installs are load-bearing, not convenience.
      #
      # ruff is pinned because the formatting gate below compares against its
      # output: an unpinned formatter turns a routine ruff release into a red
      # build on a pull request that changed no Python at all.
      - name: Install suite prerequisites
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.16.2 pyyaml

      # Several suites build throwaway git repositories and commit inside them.
      # A fresh runner has no global git identity, so those commits would fail
      # for a reason that has nothing to do with the code under test.
      - name: Configure git identity for throwaway repos
        shell: powershell
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Regression CI"
          git config --global init.defaultBranch main

      # The declaration gate above is a PowerShell block inside this file, so
      # run-all-tests.ps1 does not cover it -- that sweep is for the payload
      # under flavors/. This runs the gate's decision table, extracting the
      # step's own script and driving it against a stubbed `gh`, so that CI's
      # own machinery is not a shipped script nobody ever executed.
      - name: Test the env-change declaration gate
        shell: powershell
        run: python .github\scripts\test-env-change-gate.py

      # The promotion gate decides whether a release may merge, and it is the
      # only gate that runs on no ordinary pull request -- so without this it
      # would first execute on the release it is supposed to protect. The
      # suite also pins the three gates to the same paths and markers: they
      # are separate steps that cannot share a variable, and a promotion gate
      # looking for a marker the feature gate no longer demands would pass
      # every release while checking nothing.
      - name: Test the promotion declaration gate
        shell: powershell
        run: python .github\scripts\test-promotion-gate.py

      # check-issue-drift.py is a reporting tool, not a gate: it never fails a
      # build and never changes issue state. Its suite runs here for the same
      # reason as the one above -- CI's own machinery is otherwise a shipped
      # script nobody executes, and a classifier that silently stops matching
      # would leave the drift it detects invisible again (#231).
      - name: Test the issue drift detector
        shell: powershell
        run: python .github\scripts\test-issue-drift.py

      # .githooks/pre-commit is this repository's own hook, so the payload
      # sweep never reaches it either. Its formatting gate is the local half of
      # the CI check below, and a gate that blocks a commit has to be exercised
      # in both directions before it is trusted with anyone's working tree.
      - name: Test the pre-commit formatting gate
        shell: powershell
        run: python .github\scripts\test-precommit-format-gate.py

      # #124 made `ruff format` blocking for consumers while the framework's
      # own Python went unformatted (#167). The file list comes from git rather
      # than a hardcoded glob, so a new file is covered the moment it is
      # tracked -- and an empty list fails loudly instead of passing silently,
      # which is the failure shape this repository keeps rediscovering.
      - name: Check formatting of the framework's own Python
        shell: powershell
        run: |
          $files = git ls-files '*.py'
          if (-not $files) {
            Write-Error 'No tracked Python found -- the glob is wrong, not the repository.'
            exit 1
          }
          Write-Host "Checking $($files.Count) tracked Python files."
          ruff format --check --no-respect-gitignore @files

      # test-hooks-integration.ps1 is excluded on purpose. It does not test the
      # payload: it reads VS Code's own hook log under %APPDATA%\Code\logs to
      # confirm that hooks actually fired during a real agent session on a
      # developer's machine. A hosted runner has no such log, so it exits 2.
      # Excluding it is honest; leaving it in would fail every run for a reason
      # unrelated to the code under review.
      - name: Run all regression suites
        shell: powershell
        run: |
          .\flavors\github-copilot\.github\scripts\run-all-tests.ps1 `
            -FailOnSkip `
            -Exclude test-hooks-integration.ps1 `
            -TimeoutSeconds 1200

      # run-all-tests.ps1 sweeps `test-*.ps1` only, so the one suite covering
      # the shipped bash hooks has never been executed by anything (#190) --
      # the defect class of #61, in the half of the payload that reading alone
      # was trusted to verify. Git for Windows puts bash on every Windows
      # runner; it is simply not on PATH. The suite exits 0 when it finds no
      # usable interpreter, which here has to fail rather than pass quietly.
      - name: Run the bash hook suite
        shell: powershell
        run: |
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path $bash)) {
            Write-Error "No bash at $bash -- this step would prove nothing."
            exit 1
          }
          $out = & $bash -c 'bash flavors/github-copilot/.github/scripts/test-hooks.sh 2>&1' | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            Write-Error "The bash hook suite failed (exit $code)."
            exit 1
          }
          if ($out -match 'SKIP:') {
            Write-Error 'The suite skipped itself, so it asserted nothing.'
            exit 1
          }
          $passed = [regex]::Match($out, 'Passed:\s*(\d+)')
          if (-not $passed.Success -or [int]$passed.Groups[1].Value -lt 1) {
            Write-Error 'No passing assertions reported -- the suite ran but proved nothing.'
            exit 1
          }
          Write-Host "Bash hook suite: $($passed.Groups[1].Value) assertions passed."

      # deploy.sh aborted at exit 128 on a target that was not yet a git
      # repository, while deploy.ps1 handled the same case (#244). Nothing
      # executed the bash deploy, so the two paths could disagree unobserved.
      - name: Run the bash deploy non-repo suite
        shell: powershell
        run: |
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path $bash)) {
            Write-Error "No bash at $bash -- this step would prove nothing."
            exit 1
          }
          $out = & $bash -c 'bash flavors/github-copilot/.github/scripts/test-deploy-nonrepo.sh 2>&1' | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            Write-Error "The bash deploy non-repo suite failed (exit $code)."
            exit 1
          }
          $passed = [regex]::Match($out, 'Passed:\s*(\d+)')
          if (-not $passed.Success -or [int]$passed.Groups[1].Value -lt 1) {
            Write-Error 'No passing assertions reported -- the suite ran but proved nothing.'
            exit 1
          }
          Write-Host "Bash deploy non-repo suite: $($passed.Groups[1].Value) assertions passed."
