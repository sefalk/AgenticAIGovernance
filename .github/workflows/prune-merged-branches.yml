# Deletes agent branches whose work is already in dev.
#
# Three mechanisms were tried before this one and none of them fire:
#
#   - Settings -> Automatically delete head branches: enabled, and observed
#     not deleting the head branch of #151, #152 and #155. The last was still
#     present 27 minutes after the merge.
#   - `gh pr merge --delete-branch`: inert with `--auto`, because gh returns as
#     soon as auto-merge is armed and the merge happens minutes later inside
#     GitHub. The deletion is client-side and never runs.
#   - A `pull_request: closed` workflow: never triggered at all. Work performed
#     with GITHUB_TOKEN does not trigger further workflow runs, which is the
#     same rule that broke the two above.
#
# What all three share is a dependency on the merge event. `schedule:` does not
# depend on it, so this runs whatever merged the pull request, and also catches
# branches abandoned without ever being merged.
#
# THIS FILE DOES NOTHING UNTIL IT REACHES THE DEFAULT BRANCH. Both `schedule`
# and `workflow_dispatch` trigger only from the default branch, so while it
# lives on `dev` alone there is no nightly run and no Run workflow button --
# the workflow does not appear in the Actions list at all. On 2026-08-19 `main`
# had no `.github/workflows` directory whatsoever and `dev` was 233 commits
# ahead. `regression.yml` and `arm-auto-merge.yml` are unaffected because
# `push` and `pull_request` run the workflow from the branch involved.
#
# See #153.

name: Prune merged branches

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    name: Prune merged agent branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete agent branches fully contained in dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          kept=0
          deleted=0

          # The branch list already carries the head sha, and comparing against
          # a sha keeps the slash in `agent/...` out of the compare URL, where
          # its encoding is one more thing that could quietly misbehave.
          gh api "repos/$REPO/branches" --paginate \
            --jq '.[] | select(.name | startswith("agent/")) | "\(.name) \(.commit.sha)"' > branches.txt

          # `ahead_by` counts commits the head has and dev does not. Zero means
          # dev already contains all of them -- what a merged pull request
          # leaves behind, and what unfinished work never is.
          while read -r branch sha; do
            [ -n "$branch" ] || continue
            ahead=$(gh api "repos/$REPO/compare/dev...$sha" --jq '.ahead_by')
            if [ "$ahead" -eq 0 ]; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
              echo "deleted  $branch"
              deleted=$((deleted + 1))
            else
              echo "kept     $branch ($ahead commit(s) not in dev)"
              kept=$((kept + 1))
            fi
          done < branches.txt

          echo "::notice::deleted $deleted branch(es), kept $kept"
