# AF Project Environment Configuration
# This file is read by all AF hook scripts and the canonical test runner.
# Set SRC_DIR to your project's Python source package directory name.
#
# Examples:
#   SRC_DIR=src          (standard layout)
#   SRC_DIR=mpusage      (custom package name)
#   SRC_DIR=backend      (web project)
#
# Deploy marks this [customizable] -- it won't be overwritten on AF update.

SRC_DIR=src

# ============================================================================
# Agent Autonomy (terminal command auto-approval tiers)
# ============================================================================
# The block-dangerous hook classifies every terminal command into three tiers:
#   allow -> auto-approved, runs without a prompt (safe / no durable change)
#   ask   -> prompts you for confirmation
#   deny  -> hard-blocked (destructive/irreversible). DENY always wins over the
#            settings below: force push, push to a protected branch,
#            reset --hard, rebase, branch deletion, git add . / -A, --no-verify,
#            rm -rf <broad>, recursive force delete, dd/mkfs/format, chmod 777,
#            pipe-to-shell (| bash/iex), DROP/TRUNCATE. To run one of these,
#            run it yourself outside the agent (the agent can prepare it).
#
# AUTONOMY_LEVEL sets the default tier per category; a non-empty
# AUTONOMY_CAT_* override below wins over the level default.
#   conservative -> only read-only categories auto-approve
#   balanced     -> + tests, feature-branch git, cloud reads auto   (default)
#   autonomous   -> + package installs auto
AUTONOMY_LEVEL=balanced

# Per-category override (auto | ask | deny). Blank = use the level default.
# The trailing "(default: cons | bal | auto)" shows each category's default per level.
#
# GIT_READ    read-only git: status, diff, log, show, branch --list, rev-parse,
#             remote, blame, describe, fetch, stash list, config --get
#             (default: auto | auto | auto)
AUTONOMY_CAT_GIT_READ=
# GIT_FEATURE feature-branch work: commit, add <specific files>, create/switch
#             an agent/* branch, push agent/* (never a push to main/master/dev)
#             (default: ask | auto | auto)
AUTONOMY_CAT_GIT_FEATURE=
# TESTS       test / lint / typecheck (no file writes): pytest, python -m pytest,
#             ruff check, ruff format --check, mypy, pyright, run-tests
#             (default: ask | auto | auto)
AUTONOMY_CAT_TESTS=
# FS_READ     read-only filesystem & info: ls/dir, cat/Get-Content, head/tail,
#             grep/findstr/Select-String, Test-Path, pwd, <tool> --version,
#             pip list/show/freeze/check, whoami, hostname, Get-Date/Process/Service
#             (default: auto | auto | auto)
AUTONOMY_CAT_FS_READ=
# PKG_INSTALL package changes: pip / pip3 / python -m pip install|uninstall,
#             conda install|remove  (read-only pip list/show lives under FS_READ)
#             (default: ask | ask | auto)
AUTONOMY_CAT_PKG_INSTALL=
# DATABRICKS  full Databricks CLI INCLUDING mutating verbs (submit, run, create,
#             update, delete, import, export, deploy). auto = allow all of them.
#             Read-only list/get is covered by CLOUD_READ, not this setting.
#             (default: ask | ask | ask)
AUTONOMY_CAT_DATABRICKS=
# CLOUD_READ  read-only cloud calls: databricks <group> list/get/ls/show and
#             az ... show/list. Calls touching secrets/credentials/tokens
#             (az keyvault secret, databricks secrets get, get-access-token)
#             ALWAYS prompt, even when this is auto.
#             (default: ask | auto | auto)
AUTONOMY_CAT_CLOUD_READ=

# Branches agents must never push to / merge into directly (hard-deny).
PROTECTED_BRANCHES=main,master,dev

# Web fetch: domains auto-approved for the researcher (comma-separated, no scheme).
# Non-listed domains prompt; the agent may then offer to add the domain here.
WEB_FETCH_ALLOWLIST=learn.microsoft.com,docs.python.org,readthedocs.io,docs.github.com,pypi.org,packaging.python.org,peps.python.org,stackoverflow.com,developer.mozilla.org,kubernetes.io,developer.hashicorp.com

# Dependency spec files — agents update these when adding packages.
# DEP_FILE is the runtime/production dependency file.
# DEP_DEV_FILE is the dev/test dependency file.
# Supported formats: requirements.txt, pyproject.toml, setup.py, setup.cfg
#
# Examples:
#   DEP_FILE=requirements.txt    DEP_DEV_FILE=requirements-dev.txt
#   DEP_FILE=pyproject.toml      DEP_DEV_FILE=pyproject.toml
#   DEP_FILE=setup.py            DEP_DEV_FILE=requirements-dev.txt

DEP_FILE=requirements.txt
DEP_DEV_FILE=requirements-dev.txt

# ---------------------------------------------------------------------------
# Project Language & Environment Bootstrap
# ---------------------------------------------------------------------------
# PROJECT_LANGUAGE: active project language profile.
# Current AF behavior assumes Python; this key is a forward-compatible switch
# for future multi-language bootstrap support.
# Values: python (default)

PROJECT_LANGUAGE=python

# PY_ENV_BOOTSTRAP: behavior when coordinator runs Python-related terminal
# commands and no local .venv exists.
# Values:
#   ask    -- ask human permission to run bootstrap script (default)
#   always -- run bootstrap script automatically before continuing
#   off    -- no bootstrap interception

PY_ENV_BOOTSTRAP=ask

# ---------------------------------------------------------------------------
# Git Worktree Configuration
# ---------------------------------------------------------------------------
# WORKTREE_ENABLED: set to true to enable worktree creation for agent workflows.
# When false, all agent work runs in the main checkout.
#
# Hook scripts are worktree-aware via the .github/.active-worktree sentinel file
# (written by coordinator Step 0d, deleted at Step 8). Quality gates (pytest,
# git status, SRC_DIR lookups) correctly target the active worktree.
#
# ⚠️  LIMITATION: Only ONE active worktree at a time is supported.
#   The sentinel holds a single path. Creating a second worktree while the first
#   is active will overwrite it, breaking hook routing for the first task.
#   Parallel worktrees require Option B (auto-deploy into each WT) — pending
#   empirical verification of VS Code hook routing.
#   See ideas/feature-git-worktrees.md §13.
#
# Values: true | false

WORKTREE_ENABLED=false

# WORKTREE_DIR: directory where agent worktrees are created (only when WORKTREE_ENABLED=true).
# If left empty, the coordinator automatically computes it as:
#   ../{git_repo_folder_name}_worktrees
# For example, if the repo is "MP Field Data Analysis CT", it becomes:
#   ../MP Field Data Analysis CT_worktrees
#
# Override this if you want a different location:
# Examples:
#   WORKTREE_DIR=../agent-trees   (custom sibling path)
#   WORKTREE_DIR=/tmp/wt          (absolute path for CI environments)
#   WORKTREE_DIR=.worktrees       (inside repo — add to .gitignore)
#
# Add the directory to your .gitignore (if sibling):
#   ../{project_name}_worktrees/

WORKTREE_DIR=

# WORKTREE_VENV_MODE: Python interpreter strategy for agent worktrees.
# Values:
#   shared   -- use parent repo .venv (default, no dependency duplication)
#   isolated -- create a dedicated .venv inside each worktree
#
# Coordinator behavior:
# - Default is shared.
# - Coordinator may switch to isolated for workflows expected to change
#   dependencies (e.g., edits to DEP_FILE/DEP_DEV_FILE or lockfiles).

WORKTREE_VENV_MODE=shared

# WORKTREE_BRANCH_PREFIX: all agent worktree branches are named {prefix}/{id}.
# Must match the pattern enforced by coordinator-pretooluse hooks.
# Change only if your project uses a different branch naming convention.

WORKTREE_BRANCH_PREFIX=agent

# ---------------------------------------------------------------------------
# Python Quality & Linting Configuration
# ---------------------------------------------------------------------------
# LINTING_STRICTNESS: ruff rule set applied by the refactorer-stop linting gate.
# Values (ascending strictness):
#   minimal   -- F8 only (unused imports + undefined names)
#   standard  -- E,F,I (pycodestyle errors + pyflakes + isort)
#   strict    -- E,F,I,B,UP,SIM,C90 (+ bugbear, pyupgrade, simplify, complexity)
# Requires ruff in the active venv: pip install ruff
# If ruff is not installed the gate is BLOCKED and refactorer-stop denies handoff.

LINTING_STRICTNESS=strict

# PYLANCE_TYPE_CHECKING: mirrors python.analysis.typeCheckingMode in .vscode/settings.json.
# Keep this in sync with the workspace setting so agents know the expected strictness.
# Values: off | basic | standard | strict
# Must match .vscode/settings.json python.analysis.typeCheckingMode.

PYLANCE_TYPE_CHECKING=strict

# ---------------------------------------------------------------------------
# Jupyter Notebook Git Filter
# ---------------------------------------------------------------------------
# NOTEBOOKS_ENABLED: set to true for Python projects using Jupyter notebooks.
# When true, the bootstrap script runs `nbstripout --install` to register the
# git clean filter that strips cell outputs before commits. This prevents
# notebook outputs from polluting git history on every clone/re-setup.
#
# Prerequisites:
#   1. nbstripout must be in DEP_DEV_FILE (e.g.: nbstripout~=0.8)
#   2. .gitattributes must define the filter (see templates/gitattributes-notebooks.txt)
#
# Values: true | false (default)

NOTEBOOKS_ENABLED=false

# ---------------------------------------------------------------------------
# Deploy Backup Retention
# ---------------------------------------------------------------------------
# BACKUP_PRUNE_DAYS: retention for stale deploy conflict backups (.af-backup-*).
# Deploy auto-prunes backup folders older than this value.
#
# Precedence at deploy time:
#   1) CLI flag (-BackupPruneDays / --backup-prune-days)
#   2) BACKUP_PRUNE_DAYS from this file
#   3) default (14)
#
# Values: integer 0..3650
#   0 = disable pruning

BACKUP_PRUNE_DAYS=14

# ---------------------------------------------------------------------------
# Optional External Provider Configuration (Azure DevOps)
# ---------------------------------------------------------------------------
# These are optional. Only set when your project enables ADO capability workers.
#
# ADO_CAPABILITY_MODE:
#   off      -- no ADO capability usage (default)
#   optional -- attempt ADO operations with fallback when unavailable
#   required -- ADO operations are mandatory; unavailability is BLOCKED

ADO_CAPABILITY_MODE=off

# ADO_PROJECT: default ADO project name/id for provider-scoped workers.
# ADO_WIKI_IDENTIFIER: default wiki id/name.
# ADO_REPOSITORY_ID / ADO_REPOSITORY_NAME: optional linking helpers.

ADO_PROJECT=
ADO_WIKI_IDENTIFIER=
ADO_REPOSITORY_ID=
ADO_REPOSITORY_NAME=

# Azure DevOps pull request integration (optional; used by ado-pr-manager).
# Only active when ADO_CAPABILITY_MODE is optional/required. Request-based
# merges: feature branch -> integration branch is autonomous (autocomplete);
# integration -> protected branch is human-only. The coordinator pushes the
# feature branch; ado-pr-manager manages the PR via MCP only (no local git).
ADO_DEFAULT_TARGET_BRANCH=dev
ADO_PR_AUTOCOMPLETE_BRANCHES=dev
ADO_PR_HUMAN_ONLY_BRANCHES=main
# Optional default reviewers for PRs (comma-separated emails/ids). Empty = none.
ADO_PR_DEFAULT_REVIEWERS=
# Branches protected by the PR build-validation quality gate (optional; used by
# ado-pipeline-manager). Only active when ADO_CAPABILITY_MODE is optional/required.
# Comma-separated, e.g. dev,main. Empty = no gate branches.
ADO_GATE_BRANCHES=dev,main
