# AF Project Environment Configuration
# This file is read by all AF hook scripts and the canonical test runner.
# Set SRC_DIR to your project's Python source package directory name.
#
# Examples:
#   SRC_DIR=src          (standard layout)
#   SRC_DIR=mpusage      (custom package name)
#   SRC_DIR=backend      (web project)
#
# Deploy marks this [customizable] -- it won't be overwritten on AF update.

SRC_DIR=src

# Dependency spec files — agents update these when adding packages.
# DEP_FILE is the runtime/production dependency file.
# DEP_DEV_FILE is the dev/test dependency file.
# Supported formats: requirements.txt, pyproject.toml, setup.py, setup.cfg
#
# Examples:
#   DEP_FILE=requirements.txt    DEP_DEV_FILE=requirements-dev.txt
#   DEP_FILE=pyproject.toml      DEP_DEV_FILE=pyproject.toml
#   DEP_FILE=setup.py            DEP_DEV_FILE=requirements-dev.txt

DEP_FILE=requirements.txt
DEP_DEV_FILE=requirements-dev.txt

# ---------------------------------------------------------------------------
# Project Language & Environment Bootstrap
# ---------------------------------------------------------------------------
# PROJECT_LANGUAGE: active project language profile.
# Current AF behavior assumes Python; this key is a forward-compatible switch
# for future multi-language bootstrap support.
# Values: python (default)

PROJECT_LANGUAGE=python

# PY_ENV_BOOTSTRAP: behavior when coordinator runs Python-related terminal
# commands and no local .venv exists.
# Values:
#   ask    -- ask human permission to run bootstrap script (default)
#   always -- run bootstrap script automatically before continuing
#   off    -- no bootstrap interception

PY_ENV_BOOTSTRAP=ask

# ---------------------------------------------------------------------------
# Git Worktree Configuration
# ---------------------------------------------------------------------------
# WORKTREE_ENABLED: set to true to enable worktree creation for agent workflows.
# When false (default), all agent work runs in the main checkout.
#
# ⚠️  KNOWN OPEN ISSUES — keep false until resolved:
#   1. Hook scripts are CWD-anchored to the main checkout, not the active worktree.
#      Quality gates (pytest, git status, SRC_DIR resolution) silently run against
#      the wrong directory. See ideas/feature-git-worktrees.md §12.
#   2. Parallel worktrees (multiple simultaneous agent tasks) are not yet supported.
#      The proposed sentinel-file fix (§12 Option A) handles only one active worktree
#      at a time; auto-deploy into worktrees (§13 Option B) requires empirical
#      verification of VS Code hook routing before adoption.
#
# Values: true | false

WORKTREE_ENABLED=false

# WORKTREE_DIR: directory where agent worktrees are created (only when WORKTREE_ENABLED=true).
# If left empty, the coordinator automatically computes it as:
#   ../{git_repo_folder_name}_worktrees
# For example, if the repo is "MP Field Data Analysis CT", it becomes:
#   ../MP Field Data Analysis CT_worktrees
#
# Override this if you want a different location:
# Examples:
#   WORKTREE_DIR=../agent-trees   (custom sibling path)
#   WORKTREE_DIR=/tmp/wt          (absolute path for CI environments)
#   WORKTREE_DIR=.worktrees       (inside repo — add to .gitignore)
#
# Add the directory to your .gitignore (if sibling):
#   ../{project_name}_worktrees/

WORKTREE_DIR=

# WORKTREE_VENV_MODE: Python interpreter strategy for agent worktrees.
# Values:
#   shared   -- use parent repo .venv (default, no dependency duplication)
#   isolated -- create a dedicated .venv inside each worktree
#
# Coordinator behavior:
# - Default is shared.
# - Coordinator may switch to isolated for workflows expected to change
#   dependencies (e.g., edits to DEP_FILE/DEP_DEV_FILE or lockfiles).

WORKTREE_VENV_MODE=shared

# WORKTREE_BRANCH_PREFIX: all agent worktree branches are named {prefix}/{id}.
# Must match the pattern enforced by coordinator-pretooluse hooks.
# Change only if your project uses a different branch naming convention.

WORKTREE_BRANCH_PREFIX=agent

# ---------------------------------------------------------------------------
# Python Quality & Linting Configuration
# ---------------------------------------------------------------------------
# LINTING_STRICTNESS: ruff rule set applied by the refactorer-stop linting gate.
# Values (ascending strictness):
#   minimal   -- F8 only (unused imports + undefined names)
#   standard  -- E,F,I (pycodestyle errors + pyflakes + isort)
#   strict    -- E,F,I,B,UP,SIM,C90 (+ bugbear, pyupgrade, simplify, complexity)
# Requires ruff in the active venv: pip install ruff
# If ruff is not installed the gate is BLOCKED and refactorer-stop denies handoff.

LINTING_STRICTNESS=strict

# PYLANCE_TYPE_CHECKING: mirrors python.analysis.typeCheckingMode in .vscode/settings.json.
# Keep this in sync with the workspace setting so agents know the expected strictness.
# Values: off | basic | standard | strict
# Must match .vscode/settings.json python.analysis.typeCheckingMode.

PYLANCE_TYPE_CHECKING=strict

# ---------------------------------------------------------------------------
# Jupyter Notebook Git Filter
# ---------------------------------------------------------------------------
# NOTEBOOKS_ENABLED: set to true for Python projects using Jupyter notebooks.
# When true, the bootstrap script runs `nbstripout --install` to register the
# git clean filter that strips cell outputs before commits. This prevents
# notebook outputs from polluting git history on every clone/re-setup.
#
# Prerequisites:
#   1. nbstripout must be in DEP_DEV_FILE (e.g.: nbstripout~=0.8)
#   2. .gitattributes must define the filter (see templates/gitattributes-notebooks.txt)
#
# Values: true | false (default)

NOTEBOOKS_ENABLED=false

# ---------------------------------------------------------------------------
# Deploy Backup Retention
# ---------------------------------------------------------------------------
# BACKUP_PRUNE_DAYS: retention for stale deploy conflict backups (.af-backup-*).
# Deploy auto-prunes backup folders older than this value.
#
# Precedence at deploy time:
#   1) CLI flag (-BackupPruneDays / --backup-prune-days)
#   2) BACKUP_PRUNE_DAYS from this file
#   3) default (14)
#
# Values: integer 0..3650
#   0 = disable pruning

BACKUP_PRUNE_DAYS=14
