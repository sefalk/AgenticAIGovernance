# AF Project Environment Configuration
# This file is read by all AF hook scripts and the canonical test runner.
# Set SRC_DIR to your project's Python source package directory name.
#
# Examples:
#   SRC_DIR=src          (standard layout)
#   SRC_DIR=mpusage      (custom package name)
#   SRC_DIR=backend      (web project)
#
# Deploy marks this [customizable] -- it won't be overwritten on AF update.

SRC_DIR=src

# ============================================================================
# Agent Autonomy (terminal command auto-approval tiers)
# ============================================================================
# The block-dangerous hook classifies every terminal command into three tiers:
#   allow -> auto-approved, runs without a prompt (safe / no durable change)
#   ask   -> prompts you for confirmation
#   deny  -> hard-blocked (destructive/irreversible). DENY always wins over the
#            settings below: force push, push to a protected branch,
#            reset --hard, rebase, FORCE/protected branch deletion (-D or a
#            protected branch; safe merged-only `git branch -d` is allowed),
#            git add . / -A, --no-verify,
#            rm -rf <broad>, recursive force delete, dd/mkfs/format, chmod 777,
#            pipe-to-shell (| bash/iex), DROP/TRUNCATE. To run one of these,
#            run it yourself outside the agent (the agent can prepare it).
#
# AUTONOMY_LEVEL sets the default tier per category; a non-empty
# AUTONOMY_CAT_* override below wins over the level default.
#   conservative -> only read-only categories auto-approve
#   balanced     -> + tests, feature-branch git, reversible git (pull/merge),
#                     cloud reads auto   (default)
#   autonomous   -> + package installs, local filesystem writes auto
AUTONOMY_LEVEL=balanced

# Per-category override (auto | ask | deny). Blank = use the level default.
# The trailing "(default: cons | bal | auto)" shows each category's default per level.
#
# GIT_READ    read-only git: status, diff, log, show, branch --list, rev-parse,
#             remote, blame, describe, fetch, stash list, config --get
#             (default: auto | auto | auto)
AUTONOMY_CAT_GIT_READ=
# GIT_FEATURE feature-branch work: commit, add <specific files>, create/switch
#             an agent/* branch, push agent/* (never a push to main/master/dev),
#             switch/checkout an existing branch, delete a merged non-protected
#             branch (`git branch -d`; -D/--force and protected stay denied)
#             (default: ask | auto | auto)
AUTONOMY_CAT_GIT_FEATURE=
# GIT_MERGE   reversible topology changes: git pull, merge, cherry-pick, revert
#             (recoverable via reflog / ORIG_HEAD). reset --hard and rebase are
#             NOT in this category -- they stay denied.
#             (default: ask | auto | auto)
AUTONOMY_CAT_GIT_MERGE=
# TESTS       test / lint / typecheck (no file writes): pytest, python -m pytest,
#             ruff check, ruff format --check, mypy, pyright, run-tests
#             (default: ask | auto | auto)
AUTONOMY_CAT_TESTS=
# FS_READ     read-only filesystem & info: ls/dir, cat/Get-Content, head/tail,
#             grep/findstr/Select-String, Test-Path, pwd, <tool> --version,
#             pip list/show/freeze/check, whoami, hostname, Get-Date/Process/Service
#             (default: auto | auto | auto)
AUTONOMY_CAT_FS_READ=
# PKG_INSTALL package changes: pip / pip3 / python -m pip install|uninstall,
#             conda install|remove  (read-only pip list/show lives under FS_READ)
#             (default: ask | ask | auto)
AUTONOMY_CAT_PKG_INSTALL=
# DATABRICKS  full Databricks CLI INCLUDING mutating verbs (submit, run, create,
#             update, delete, import, export, deploy). auto = allow all of them.
#             Read-only list/get is covered by CLOUD_READ, not this setting.
#             (default: ask | ask | ask)
AUTONOMY_CAT_DATABRICKS=
# CLOUD_READ  read-only cloud calls: databricks <group> list/get/ls/show and
#             az ... show/list. Calls touching secrets/credentials/tokens
#             (az keyvault secret, databricks secrets get, get-access-token)
#             ALWAYS prompt, even when this is auto.
#             (default: ask | auto | auto)
AUTONOMY_CAT_CLOUD_READ=
# FS_WRITE    local, non-destructive filesystem writes (opt-in): Out-File,
#             Set-Content, Add-Content, New-Item/mkdir, Move-Item/Copy-Item,
#             mv/cp, a `> file` redirect, and a SINGLE-file Remove-Item/rm.
#             Recursive/force deletes and broad `rm` stay hard-denied regardless.
#             Lets you stop prompts for harmless scratch writes; off by default.
#             (default: ask | ask | auto)
AUTONOMY_CAT_FS_WRITE=

# Directories containing reviewed scripts that createAndRunTask may invoke.
# Comma-separated, repo-relative. The allowlist policy rejects bare binaries
# (git, ruff, pytest, etc.) and only permits command paths under these directories.
AF_TASK_SCRIPT_DIRS=.github/scripts

# Branches agents must never push to / merge into directly (hard-deny).
PROTECTED_BRANCHES=main,master,dev

# Web fetch: domains auto-approved for the researcher (comma-separated, no scheme).
# Non-listed domains prompt; the agent may then offer to add the domain here.
WEB_FETCH_ALLOWLIST=learn.microsoft.com,docs.python.org,readthedocs.io,docs.github.com,pypi.org,packaging.python.org,peps.python.org,stackoverflow.com,developer.mozilla.org,kubernetes.io,developer.hashicorp.com

# ---------------------------------------------------------------------------
# Agent model tiers (resolved into subagent `model:` at deploy time)
# ---------------------------------------------------------------------------
# The coordinator stays UNPINNED (it inherits your model picker). Each subagent
# carries a tier placeholder in its .agent.md; deploy replaces it with the model
# list below. Multiple comma-separated entries become a prioritized YAML array
# -- VS Code tries each until one is available (drift-resilient). Leave a tier
# BLANK to use the deploy's curated built-in default. Format: "Model Name
# (vendor)", e.g. Claude Sonnet 5 (copilot). Curate on model line-up changes,
# then re-deploy.
#   PREMIUM   -> arbiter, code-critic (deep reasoning)
#   BALANCED  -> planner, implementer, test-critic
#   EFFICIENT -> test-writer, refactorer, documenter, researcher,
#                compliance-checker, ado-* workers
AF_MODEL_TIER_PREMIUM=
AF_MODEL_TIER_BALANCED=
AF_MODEL_TIER_EFFICIENT=

# ---------------------------------------------------------------------------
# Subagent Return Verbosity
# ---------------------------------------------------------------------------
# OUTPUT_VERBOSITY: how much a subagent writes back into the coordinator's
# context when it SUCCEEDS. Everything a subagent returns is re-sent as input
# with every following coordinator turn, so a verbose success costs far more
# than the tokens it took to write once.
#
# THE INVARIANT, IN EVERY MODE: failure output is never reduced. REJECTED,
# ESCALATE, FAILED, BLOCKED, and any failed HARD gate always return full
# detail, because that is exactly what the retry consumes. Only the path where
# nothing went wrong gets shorter. Verdict headers
# (`## Code Review Verdict: {V}` etc.) are HARD gates and are never dropped.
#
# Values:
#   full      -- every section always emitted (default; pre-existing behaviour)
#   standard  -- on success: Gate Summary collapses to one line; an APPROVED
#                verdict is header + Summary + that line. Recommended.
#   lean      -- as standard, plus: APPROVED verdicts drop the Summary prose,
#                and producer returns list changed files without per-file
#                descriptions. Use when workflows are long and mostly green.
#
# Default is `full` so existing projects are unaffected until they opt in.

OUTPUT_VERBOSITY=full

# ---------------------------------------------------------------------------
# Retro Destination
# ---------------------------------------------------------------------------
# RETRO_DIR: where the documenter writes its retro snippets.
#
# The default is local-only instrumentation -- the directory ships a
# `.gitignore` and its contents never enter version control. That default
# exists because retros were originally classed with the workflow logs. The
# two are not the same class: the log embeds the user request verbatim, which
# is a reason to keep it out of the repository; the retro records a lesson the
# workflow learned, which is not.
#
# Point this at a tracked directory -- e.g. `docs/retros` -- to keep retros as
# reviewable project history. Nothing else about the mechanism changes: the
# documenter, both Stop gates and the retro-summary prompt all resolve this
# key, and there is still exactly ONE destination, which is what makes a
# misplaced retro detectable rather than merely tolerated (issue #98).
#
# Relative to the repository root, no trailing slash. Leave it at the default
# and behaviour is byte-for-byte what it was before this key existed.

RETRO_DIR=.github/retros/auto

# ---------------------------------------------------------------------------
# Context Budget
# ---------------------------------------------------------------------------
# Enforced by `.github/scripts/check-context-budget.py`. Instruction files grow
# by accretion: every new rule looks small on its own, and `applyTo: '**'` is
# the path of least resistance for an author who wants the rule to be seen.
# These budgets turn that drift into a build failure.
#
# The AF_* ceilings cover ONLY the files the framework owns. Anything the
# manifest marks [customizable] -- `copilot-instructions.md`,
# `instructions/architecture.instructions.md` -- plus anything a project adds
# of its own is charged to AF_PROJECT_* instead. Before that split the two
# shared a single ceiling, so AF's own three always-on files took 3,461 of
# 4,950 and left the project 1,489 tokens to describe itself in, while AF's own
# template invites about 2,000. Every consumer failed on arrival, and the only
# available responses were to raise the ceiling until it passed -- turning a
# drift detector into a rubber stamp -- or to shrink the project's own
# self-description to fit the framework's leftovers (issue #107).
#
# AF_CONTEXT_BUDGET_TOKENS -- the framework's always-on set: every
# `instructions/*.md` AF owns whose applyTo glob matches all files. This
# payload prefixes EVERY chat request, so it is multiplied by every turn of
# every workflow -- by far the highest-leverage number in the framework.
#
# AF_AGENT_CONTEXT_BUDGET_TOKENS -- per agent: its own prompt plus the
# framework's always-on set. Keeps a single agent file from silently regrowing.
# The project's share is deliberately excluded: an agent must not fail because
# the consuming project wrote itself a longer README.
#
# AF_CONDITIONAL_BUDGET_TOKENS -- every AF-owned `instructions/*.md` with a
# narrower applyTo, summed. A narrow glob makes a file load less often; it does
# not make it cheap, and for the agent whose job is to touch matching files it
# is effectively always-on. The checker also prints a per-agent worst case (own
# + always-on + all conditional) as an upper bound, but does not gate on it:
# co-occurrence is not computable offline, and failing every agent for one
# shared cause is a broken signal, not a strict one.
#
# AF_PROJECT_CONTEXT_BUDGET_TOKENS and AF_PROJECT_CONDITIONAL_BUDGET_TOKENS --
# the project's own two ceilings. These are NOT framework limits and no number
# here is right for another repository. Seed them from what the project
# actually has:
#
#     python .github/scripts/check-context-budget.py --seed-project-budget
#
# Deploy runs that on a fresh install. Left unset, the checker measures the
# project's share, prints it as UNBUDGETED and does not gate it -- a project
# that has never stated a baseline has not drifted from one. The framework
# share stays gated either way, which is the part this repository can honestly
# enforce.
#
# Defaults are calibrated against the measured payload with deliberately small
# headroom (~2-3%). That is the point: adding an always-on rule should require
# removing something, narrowing an applyTo, or a conscious decision to raise the
# budget -- not an unnoticed drift. Raise these only with a stated reason.
#
# Token counts are estimated as characters/4, read in text mode. Characters
# rather than bytes on disk, so the gate does not move when `core.autocrlf`
# flips, when an author types an em dash instead of a hyphen, or when an editor
# leaves a BOM -- none of which change what the model reads (issue #59). The
# divisor is measured, not a rule of thumb: calibrated 2026-08-12 with tiktoken
# (o200k_base, cross-checked against cl100k_base) over all 24 files the gate
# measures -- 183,317 characters to 44,602 real tokens = 4.110 characters per
# token, per-file range 3.83 to 4.29.
#
# So characters/4 is accurate to -4.2%/+7.2% per file (+2.8% median), and it
# errs high: it reports slightly more tokens than exist, which is the safe
# direction for a ceiling. By group: always-on +3.6%, conditional +1.7%,
# agents +2.8%. Re-check with `check-context-budget.py --verify-tokenizer`.
#
# Measured 2026-08-12 on the character scale, framework share only: always-on
# 3,461; conditional 3,824; largest agent (coordinator) 9,227. Each AF budget
# below is that figure plus the headroom it previously carried against the
# combined ceiling (1.75%, 1.08%, 2.52%), rounded down to the nearest 50 --
# the split tightens the framework's own limit, it does not relax it.

AF_CONTEXT_BUDGET_TOKENS=3500
AF_AGENT_CONTEXT_BUDGET_TOKENS=9450
AF_CONDITIONAL_BUDGET_TOKENS=3850

# Project context budgets seeded 2026-08-12 from this repository: always-on
# 1,404 tok, conditional 1,617 tok, +10% headroom, rounded up to the nearest 50.
# These two describe THIS repository -- for the framework, the "project" files
# are the templates it ships. Deploy re-seeds them from the target on a fresh
# install; if it cannot, it says so and names the command. Do not treat these
# numbers as a recommendation for your project.
AF_PROJECT_CONTEXT_BUDGET_TOKENS=1550
AF_PROJECT_CONDITIONAL_BUDGET_TOKENS=1800

# Dependency spec files — agents update these when adding packages.
# DEP_FILE is the runtime/production dependency file.
# DEP_DEV_FILE is the dev/test dependency file.
# Supported formats: requirements.txt, pyproject.toml, setup.py, setup.cfg
#
# Examples:
#   DEP_FILE=requirements.txt    DEP_DEV_FILE=requirements-dev.txt
#   DEP_FILE=pyproject.toml      DEP_DEV_FILE=pyproject.toml
#   DEP_FILE=setup.py            DEP_DEV_FILE=requirements-dev.txt

DEP_FILE=requirements.txt
DEP_DEV_FILE=requirements-dev.txt

# ---------------------------------------------------------------------------
# Project Language & Environment Bootstrap
# ---------------------------------------------------------------------------
# PROJECT_LANGUAGE: active project language profile.
# Current AF behavior assumes Python; this key is a forward-compatible switch
# for future multi-language bootstrap support.
# Values: python (default)

PROJECT_LANGUAGE=python

# PY_ENV_BOOTSTRAP: behavior when coordinator runs Python-related terminal
# commands and no local .venv exists.
# Values:
#   ask    -- ask human permission to run bootstrap script (default)
#   always -- run bootstrap script automatically before continuing
#   off    -- no bootstrap interception

PY_ENV_BOOTSTRAP=ask

# ---------------------------------------------------------------------------
# Git Worktree Configuration
# ---------------------------------------------------------------------------
# WORKTREE_ENABLED: set to true to enable worktree creation for agent workflows.
# When false, all agent work runs in the main checkout.
#
# Hook scripts are worktree-aware via the .github/.active-worktree sentinel file
# (written by coordinator Step 0d, deleted at Step 8). Quality gates (pytest,
# git status, SRC_DIR lookups) correctly target the active worktree.
#
# ⚠️  LIMITATION: Only ONE active worktree at a time is supported.
#   The sentinel holds a single path. Creating a second worktree while the first
#   is active will overwrite it, breaking hook routing for the first task.
#   Parallel worktrees require Option B (auto-deploy into each WT) — pending
#   empirical verification of VS Code hook routing.
#   See ideas/feature-git-worktrees.md §13.
#
# Values: true | false

WORKTREE_ENABLED=false

# WORKTREE_DIR: directory where agent worktrees are created (only when WORKTREE_ENABLED=true).
# If left empty, the coordinator automatically computes it as:
#   ../{git_repo_folder_name}_worktrees
# For example, if the repo is "MP Field Data Analysis CT", it becomes:
#   ../MP Field Data Analysis CT_worktrees
#
# Override this if you want a different location:
# Examples:
#   WORKTREE_DIR=../agent-trees   (custom sibling path)
#   WORKTREE_DIR=/tmp/wt          (absolute path for CI environments)
#   WORKTREE_DIR=.worktrees       (inside repo — add to .gitignore)
#
# Add the directory to your .gitignore (if sibling):
#   ../{project_name}_worktrees/

WORKTREE_DIR=

# WORKTREE_VENV_MODE: Python interpreter strategy for agent worktrees.
# Values:
#   shared   -- use parent repo .venv (default, no dependency duplication)
#   isolated -- create a dedicated .venv inside each worktree
#
# Coordinator behavior:
# - Default is shared.
# - Coordinator may switch to isolated for workflows expected to change
#   dependencies (e.g., edits to DEP_FILE/DEP_DEV_FILE or lockfiles).

WORKTREE_VENV_MODE=shared

# WORKTREE_BRANCH_PREFIX: all agent worktree branches are named {prefix}/{id}.
# Must match the pattern enforced by coordinator-pretooluse hooks.
# Change only if your project uses a different branch naming convention.

WORKTREE_BRANCH_PREFIX=agent

# ---------------------------------------------------------------------------
# Python Quality & Linting Configuration
# ---------------------------------------------------------------------------
# LINTING_STRICTNESS: ruff rule set applied by the linting hard gate in
# implementer-stop and refactorer-stop, and by .github/scripts/run-lint.*.
# Scope: changed .py files under SRC_DIR/ AND tests/.
# Values (ascending strictness):
#   minimal   -- F8 only (unused imports + undefined names)
#   standard  -- E,F,I (pycodestyle errors + pyflakes + isort)
#   strict    -- E,F,I,B,UP,SIM,C90 (+ bugbear, pyupgrade, simplify, complexity)
# Requires ruff in the active venv: pip install ruff
# If ruff is not installed the gate is BLOCKED and the stop hook denies handoff.
#
# Precedence vs. the project's own ruff config:
#   The strictness set is a FLOOR, not a replacement. An explicit `ignore` /
#   `per-file-ignores` in the project's ruff config (.ruff.toml, ruff.toml or
#   pyproject.toml [tool.ruff]) WINS over that floor -- a codebase that is
#   clean by its own contract is not blocked by the gate.
#   Two things are deliberately not honoured:
#     - `select`: NOT selecting a rule is not an exception. The floor applies.
#     - F8 (unused imports, undefined names): the non-overridable core. No
#       project config can switch it off; the gate reports every rejected
#       override in its banner (core_override_rejected=...).

LINTING_STRICTNESS=strict

# BASE_BRANCH: the branch feature work is cut from and merged back into.
# Provider-neutral on purpose -- ADO_DEFAULT_TARGET_BRANCH is capability-scoped
# and must not be depended on when ADO_CAPABILITY_MODE=off.
#
# The linting gate uses it to widen its input set from "changed since the last
# phase commit" to the BRANCH DELTA (merge-base(HEAD, BASE_BRANCH)..HEAD).
# Without it, a violation committed in the Red phase is invisible to the
# implementer and refactorer, and ships unlinted.
#
# Scope policy for the widened set:
#   - Violations in files the CURRENT step touched  -> block (as before).
#   - Violations inherited from an earlier phase    -> also block, but the
#     message says so. The legal moves are: fix it (usually `ruff check --fix`),
#     or acknowledge it with `# noqa: RULE  # reason` in its own standalone
#     commit. Both are visible in the PR; neither is silent.
#
# If the branch cannot be resolved (base branch absent, no merge-base, fresh
# repo), the gate degrades to the previous index/HEAD set rather than blocking.

BASE_BRANCH=dev

# PYLANCE_TYPE_CHECKING: mirrors python.analysis.typeCheckingMode in .vscode/settings.json.
# Keep this in sync with the workspace setting so agents know the expected strictness.
# Values: off | basic | standard | strict
# Must match .vscode/settings.json python.analysis.typeCheckingMode.

PYLANCE_TYPE_CHECKING=strict

# ---------------------------------------------------------------------------
# Jupyter Notebook Git Filter
# ---------------------------------------------------------------------------
# NOTEBOOKS_ENABLED: set to true for Python projects using Jupyter notebooks.
# When true, the bootstrap script runs `nbstripout --install` to register the
# git clean filter that strips cell outputs before commits. This prevents
# notebook outputs from polluting git history on every clone/re-setup.
#
# Prerequisites:
#   1. nbstripout must be in DEP_DEV_FILE (e.g.: nbstripout~=0.8)
#   2. .gitattributes must define the filter (see templates/gitattributes-notebooks.txt)
#
# Values: true | false (default)

NOTEBOOKS_ENABLED=false

# ---------------------------------------------------------------------------
# Large File Commit Guard
# ---------------------------------------------------------------------------
# A real git pre-commit hook (.github/hooks/git/pre-commit, enabled via
# `git config core.hooksPath .github/hooks/git` -- done automatically by
# bootstrap-python-env.ps1/.sh) blocks commits that stage a file larger than
# LARGE_FILE_MAX_BYTES. It checks the staged index blob size (exactly what is
# committed), not the working tree. Deliberate large files are exempted via
# LARGE_FILE_ALLOWLIST; a one-off commit can override with
# `ALLOW_LARGE_FILES=1 git commit ...`. Existing clones must re-run bootstrap
# once to wire the hook (core.hooksPath is not retroactive).
#
# LARGE_FILE_MAX_BYTES: threshold in bytes. Default 1048576 (1 MB).
LARGE_FILE_MAX_BYTES=1048576
# LARGE_FILE_ALLOWLIST: comma-separated fnmatch globs (repo-relative staged
# path) exempt from the guard. Empty = no allowlist.
# Example: LARGE_FILE_ALLOWLIST=docs/wiki/assets/**,src/assets/*.csv
LARGE_FILE_ALLOWLIST=

# ---------------------------------------------------------------------------
# Deploy Backup Retention
# ---------------------------------------------------------------------------
# BACKUP_PRUNE_DAYS: retention for stale deploy conflict backups (.af-backup-*).
# Deploy auto-prunes backup folders older than this value.
#
# Precedence at deploy time:
#   1) CLI flag (-BackupPruneDays / --backup-prune-days)
#   2) BACKUP_PRUNE_DAYS from this file
#   3) default (14)
#
# Values: integer 0..3650
#   0 = disable pruning

BACKUP_PRUNE_DAYS=14

# ---------------------------------------------------------------------------
# Optional External Provider Configuration (Azure DevOps)
# ---------------------------------------------------------------------------
# These are optional. Only set when your project enables ADO capability workers.
#
# ADO_CAPABILITY_MODE:
#   off      -- no ADO capability usage (default)
#   optional -- attempt ADO operations with fallback when unavailable
#   required -- ADO operations are mandatory; unavailability is BLOCKED

ADO_CAPABILITY_MODE=off

# ADO_ORGANIZATION: organization name only (e.g. 'contoso'), not a URL.
#   The MCP server resolves the organization from its own configuration, so
#   this is not how the connection is established. It is needed because agents
#   construct artifact web links (see the ado-shared skill) and cannot derive
#   the organization from every MCP response. Leave empty to have agents fall
#   back to whatever the response carries.
ADO_ORGANIZATION=

# ADO_PROJECT: default ADO project name/id for provider-scoped workers.
# ADO_WIKI_IDENTIFIER: default project-wiki id/name (general/project-wide docs).
# ADO_REPOSITORY_ID / ADO_REPOSITORY_NAME: optional linking helpers.

ADO_PROJECT=
ADO_WIKI_IDENTIFIER=
ADO_REPOSITORY_ID=
ADO_REPOSITORY_NAME=

# ADO_CODE_WIKI_PATH: in-repo path for repo-specific ("code as wiki")
#   documentation, versioned alongside the code. General / project-wide notes
#   go to the project wiki (ADO_WIKI_IDENTIFIER); repo-scoped docs live here in
#   the repository. Default: docs/wiki.
ADO_CODE_WIKI_PATH=docs/wiki

# Work item routing defaults (used by ado-work-item-manager on CREATE).
# ADO_DEFAULT_AREA_PATH: board Area Path for new work items, e.g.
#   "MyProject\My Team Area". This determines which board/team owns created
#   items. Empty = the project's default area is used (items may land in an
#   unexpected board).
# ADO_DEFAULT_ITERATION_PATH: Iteration Path for new items (optional; empty =
#   inherit from parent / project default).
# ADO_DEFAULT_TEAM: default team for team-scoped board/query operations (optional).
ADO_DEFAULT_AREA_PATH=
ADO_DEFAULT_ITERATION_PATH=
ADO_DEFAULT_TEAM=

# Azure DevOps pull request integration (optional; used by ado-pr-manager).
# Only active when ADO_CAPABILITY_MODE is optional/required. Request-based
# merges: feature branch -> integration branch is autonomous (autocomplete);
# integration -> protected branch is human-only. The coordinator pushes the
# feature branch; ado-pr-manager manages the PR via MCP only (no local git).
ADO_DEFAULT_TARGET_BRANCH=dev
ADO_PR_AUTOCOMPLETE_BRANCHES=dev
ADO_PR_HUMAN_ONLY_BRANCHES=main
# ADO_PR_MERGE_STRATEGY: merge strategy for autocompleted PRs. Use 'noFastForward'
#   (creates a merge commit) so the feature branch tip stays reachable from the
#   target branch and `git branch -d agent/*` recognizes it as merged. Avoid
#   'squash' (creates a new commit that does NOT contain the branch tip, which
#   makes safe `git branch -d` fail and forces a policy-denied force-delete).
#   Values: noFastForward | squash | rebase | rebaseMerge. Default: noFastForward.
ADO_PR_MERGE_STRATEGY=noFastForward
# Optional default reviewers for PRs (comma-separated emails/ids). Empty = none.
ADO_PR_DEFAULT_REVIEWERS=
# Branches protected by the PR build-validation quality gate (optional; used by
# ado-pipeline-manager). Only active when ADO_CAPABILITY_MODE is optional/required.
# Comma-separated, e.g. dev,main. Empty = no gate branches.
ADO_GATE_BRANCHES=dev,main

# ---------------------------------------------------------------------------
# Optional External Provider Configuration (GitHub Issues)
# ---------------------------------------------------------------------------
# Used by the gh-issue-manager worker. Two independent routes share one worker;
# each has its own gate, because a project may want one without the other.
#
# GH_CAPABILITY_MODE -- the project's OWN issue tracker on GitHub.
#   off      -- no GitHub issue usage (default)
#   optional -- attempt GitHub operations with fallback when unavailable
#   required -- GitHub operations are mandatory; unavailability is BLOCKED
# Independent of ADO_CAPABILITY_MODE: a project may track its work items in
# Azure DevOps and still report framework defects upstream to GitHub.

GH_CAPABILITY_MODE=off

# GH_OWNER / GH_REPOSITORY: target for the 'project' route. Owner is the user
# or organization name only, not a URL.
GH_OWNER=
GH_REPOSITORY=

# ---------------------------------------------------------------------------
# Framework Defect Reporting (upstream route)
# ---------------------------------------------------------------------------
# When a workflow uncovers a defect in the Agent Framework itself, the
# consumer's own tracker is the wrong destination -- nobody who can fix it
# reads that board. This route files the report against the framework repo.
#
# AF_UPSTREAM_REPORTING:
#   off      -- never file upstream (default). gh-issue-manager still returns
#               the drafted issue body so the human can file it manually.
#   optional -- file upstream when reachable; fall back to a drafted body.
#   required -- upstream filing is mandatory; unavailability is BLOCKED.
#
# Reports crossing an organizational boundary are redaction-swept first (no
# secrets, no absolute user paths, no internal identifiers) -- see
