# AF Project Environment Configuration
# This file is read by all AF hook scripts and the canonical test runner.
# Set SRC_DIR to your project's Python source package directory name.
#
# Examples:
#   SRC_DIR=src          (standard layout)
#   SRC_DIR=mpusage      (custom package name)
#   SRC_DIR=backend      (web project)
#
# Deploy marks this [customizable] -- it won't be overwritten on AF update.

SRC_DIR=src

# Dependency spec files — agents update these when adding packages.
# DEP_FILE is the runtime/production dependency file.
# DEP_DEV_FILE is the dev/test dependency file.
# Supported formats: requirements.txt, pyproject.toml, setup.py, setup.cfg
#
# Examples:
#   DEP_FILE=requirements.txt    DEP_DEV_FILE=requirements-dev.txt
#   DEP_FILE=pyproject.toml      DEP_DEV_FILE=pyproject.toml
#   DEP_FILE=setup.py            DEP_DEV_FILE=requirements-dev.txt

DEP_FILE=requirements.txt
DEP_DEV_FILE=requirements-dev.txt

# ---------------------------------------------------------------------------
# Git Worktree Configuration
# ---------------------------------------------------------------------------
# WORKTREE_DIR: directory where agent worktrees are created.
# Use a sibling path (../wt) to keep the repository folder clean.
# The coordinator reads this when running Step 0d (worktree bootstrap)
# and Step 8 (worktree cleanup).
#
# Examples:
#   WORKTREE_DIR=../wt            (default — sibling, cross-platform path)
#   WORKTREE_DIR=../agent-trees   (if ‘wt’ conflicts with an existing folder)
#   WORKTREE_DIR=/tmp/wt          (absolute path for CI environments)
#
# Add the directory to your .gitignore:
#   ../wt/

WORKTREE_DIR=../wt

# WORKTREE_BRANCH_PREFIX: all agent worktree branches are named {prefix}/{id}.
# Must match the pattern enforced by coordinator-pretooluse hooks.
# Change only if your project uses a different branch naming convention.

WORKTREE_BRANCH_PREFIX=agent
