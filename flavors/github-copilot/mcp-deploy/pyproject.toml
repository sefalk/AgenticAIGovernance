[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aaig-deploy-mcp"
version = "0.1.0"
description = "AAIG deploy MCP server (proof of concept) — read-only framework status & deploy dry-run over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aaig-deploy-mcp = "aaig_deploy_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["aaig_deploy_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
