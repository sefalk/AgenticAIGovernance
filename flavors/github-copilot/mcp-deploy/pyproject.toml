[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "af-deploy-mcp"
dynamic = ["version"]
description = "AF deploy MCP server (PoC) — framework status, dry-run, guarded apply, conflict resolution and [vscode] coverage over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Lower bound is load-bearing: server.py imports mcp.server.mcpserver, which does
# not exist before mcp 2.x (#274). The upper bound keeps a clean install from
# resolving the next breaking major; Dependabot proposes it as a pull request
# instead (#275, asserted by .github/scripts/test-dependency-bounds.py).
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
af-deploy-mcp = "af_deploy_mcp.server:main"
af-command-mcp = "af_deploy_mcp.command_server:main"

# Package version tracks the AF framework VERSION, so a wheel's version equals the
# bundled payload version (af-deploy-mcp@X == AF payload X). Rebuild + reinstall
# per AF release to refresh the bundled payload.
[tool.hatch.version]
path = "../VERSION"
pattern = "(?P<version>[^\\s]+)"

[tool.hatch.build.targets.wheel]
packages = ["af_deploy_mcp"]

# Bundle the framework payload INTO the wheel only (never committed to git, so no
# duplicate/drift). At runtime resolve_source_root() prefers this bundled copy,
# so an installed server needs no AF clone next to the target project.
[tool.hatch.build.targets.wheel.force-include]
"../.github" = "af_deploy_mcp/payload/.github"
"../.vscode" = "af_deploy_mcp/payload/.vscode"
"../VERSION" = "af_deploy_mcp/payload/VERSION"

# Stamps af_deploy_mcp/payload/SOURCE_COMMIT: the bundled copy is no checkout (#429).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
